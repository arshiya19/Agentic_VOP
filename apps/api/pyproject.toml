[project]
name = "agentic-vop-api"
version = "0.1.0"
description = "FastAPI gateway for Agentic_VOP — receives user triggers, dispatches to agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "B",   # flake8-bugbear (likely bugs and bad practices)
    "S",   # flake8-bandit subset (security-adjacent patterns)
    "UP",  # pyupgrade (modern Python idioms)
]
ignore = [
    "S101",  # assert usage — acceptable in tests
    "S603",  # subprocess without shell=True — used intentionally nowhere yet
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]  # silence security rules in test files
