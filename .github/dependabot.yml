version: 2
updates:
  # Python (pip) — monitor only the real application, exclude intentionally vulnerable labs
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # npm — monitor only the real web app
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

# Note: infra/vuln-labs/appsec-lab is intentionally NOT listed here.
# It contains pinned vulnerable dependencies for security scanning demos.
