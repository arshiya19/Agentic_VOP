# =============================================================================
# Agentic_VOP — Infrastructure Deploy Pipeline
# =============================================================================
# Triggers on merge to main when files under infra/** are modified.
#
# Deployment strategy:
#   dev  — auto-apply immediately after merge
#   prod — requires manual approval via GitHub Environment protection rules
#
# Safety:
#   - Concurrency groups prevent concurrent applies per environment
#   - cancel-in-progress disabled so running applies are never interrupted
#   - Error summaries posted as PR comments on failure
#   - OIDC authentication (no static credentials)
#
# Requirements: 12.4–12.7
# =============================================================================

name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/vuln-labs/**"
      - "!infra/app-hosting/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  # ---------------------------------------------------------------------------
  # 1. Deploy to dev (auto-apply)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: "Deploy · dev (auto-apply)"
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: infra-apply-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sisyfix-github-infra-apply-dev
          aws-region: us-east-1
          role-session-name: gh-infra-deploy-dev-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init (dev)
        working-directory: infra
        run: terraform init -backend-config=backend/dev.hcl

      - name: Terraform Apply (dev)
        id: apply
        working-directory: infra
        run: |
          terraform apply \
            -var-file=environments/dev.tfvars \
            -auto-approve \
            -no-color 2>&1 | tee apply-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post error summary on failure
        if: failure() && steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('infra/apply-output.txt', 'utf8');
            } catch (e) {
              output = 'Unable to read apply output.';
            }

            // Truncate to fit PR comment limits
            const maxLen = 60000;
            if (output.length > maxLen) {
              output = output.substring(0, maxLen) + '\n\n... (truncated)';
            }

            const body = `## ❌ Terraform Apply Failed (dev)

            **Commit:** \`${context.sha.substring(0, 8)}\`
            **Workflow:** [Run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            <details>
            <summary>Error Output</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>`;

            // Find the PR associated with this merge commit
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (pulls.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls[0].number,
                body: body,
              });
            }

  # ---------------------------------------------------------------------------
  # 2. Deploy to prod (manual approval required)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: "Deploy · prod (manual approval)"
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod
    concurrency:
      group: infra-apply-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sisyfix-github-infra-apply-prod
          aws-region: us-east-1
          role-session-name: gh-infra-deploy-prod-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init (prod)
        working-directory: infra
        run: terraform init -backend-config=backend/prod.hcl

      - name: Terraform Apply (prod)
        id: apply
        working-directory: infra
        run: |
          terraform apply \
            -var-file=environments/prod.tfvars \
            -auto-approve \
            -no-color 2>&1 | tee apply-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post error summary on failure
        if: failure() && steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('infra/apply-output.txt', 'utf8');
            } catch (e) {
              output = 'Unable to read apply output.';
            }

            // Truncate to fit PR comment limits
            const maxLen = 60000;
            if (output.length > maxLen) {
              output = output.substring(0, maxLen) + '\n\n... (truncated)';
            }

            const body = `## ❌ Terraform Apply Failed (prod)

            **Commit:** \`${context.sha.substring(0, 8)}\`
            **Workflow:** [Run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            <details>
            <summary>Error Output</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>`;

            // Find the PR associated with this merge commit
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (pulls.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pulls[0].number,
                body: body,
              });
            }
