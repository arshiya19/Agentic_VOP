# =============================================================================
# Agentic_VOP — Infrastructure Plan (PR Validation)
# =============================================================================
# Runs on pull requests that modify files under infra/.
#
# Steps:
#   1. terraform fmt -check   — Enforce canonical formatting
#   2. terraform validate     — Syntax and provider validation
#   3. Checkov                — IaC static analysis (CRITICAL/HIGH block)
#   4. terraform plan         — Preview changes, post as PR comment
#
# Authentication: GitHub OIDC → AWS role sisyfix-github-infra-plan
# Requirements: 12.1–12.3, 12.6, 20.5–20.7
# =============================================================================

name: Infrastructure Plan

on:
  pull_request:
    branches: ["**"]
    paths:
      - "infra/**"
      - "!infra/vuln-labs/**"
      - "!infra/app-hosting/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      # -----------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # AWS Authentication via GitHub OIDC
      # Requirement 12.6: Use sisyfix-github-infra-plan role for PRs
      # -----------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sisyfix-github-infra-plan
          role-session-name: github-actions-infra-plan
          aws-region: us-east-1

      # -----------------------------------------------------------------
      # Terraform Setup
      # -----------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # -----------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------
      - name: Terraform Init
        run: terraform init -backend-config=backend/dev.hcl -input=false

      # -----------------------------------------------------------------
      # Step 1: terraform fmt -check
      # Requirement 12.1: Run terraform fmt -check on PRs
      # -----------------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -----------------------------------------------------------------
      # Step 2: terraform validate
      # Requirement 12.1: Run terraform validate on PRs
      # -----------------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -----------------------------------------------------------------
      # Step 3: Checkov — IaC static analysis
      # Requirements 20.5–20.7: Run Checkov on HCL and plan output
      # -----------------------------------------------------------------
      - name: Install Checkov
        run: pip install checkov

      - name: Checkov Scan (HCL)
        id: checkov_hcl
        run: |
          checkov -d . \
            --framework terraform \
            --output cli \
            --output json \
            --output-file-path . \
            --soft-fail \
            || true

      - name: Evaluate Checkov Results
        run: |
          python3 - <<'EOF'
          import json, sys, os

          report_path = "results_json.json"
          if not os.path.exists(report_path):
              print("::warning::Checkov report not found — skipping gate evaluation.")
              sys.exit(0)

          with open(report_path) as f:
              try:
                  report = json.load(f)
              except json.JSONDecodeError:
                  print("::warning::Checkov produced invalid JSON — skipping gate evaluation.")
                  sys.exit(0)

          # Checkov JSON can be a list of check types or a single object
          checks = []
          if isinstance(report, list):
              for entry in report:
                  checks.extend(entry.get("results", {}).get("failed_checks", []))
          else:
              checks = report.get("results", {}).get("failed_checks", [])

          # Classify findings by severity
          # Checkov uses severity field: CRITICAL, HIGH, MEDIUM, LOW
          blocking = []
          warnings = []

          for check in checks:
              severity = check.get("severity", check.get("check_result", {}).get("severity", "UNKNOWN"))
              if severity is None:
                  severity = "UNKNOWN"
              severity = severity.upper()

              if severity in ("CRITICAL", "HIGH"):
                  blocking.append(check)
              elif severity in ("MEDIUM", "LOW"):
                  warnings.append(check)
              else:
                  # Checks without explicit severity — treat as warnings
                  warnings.append(check)

          # Requirement 20.7: Display MEDIUM/LOW as workflow warnings
          if warnings:
              print("::warning::Checkov — Medium/Low findings (non-blocking):")
              for c in warnings[:20]:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  print(f"  [{check_id}] {resource} — {name}")

          # Requirement 20.6: Fail on CRITICAL/HIGH findings
          if blocking:
              print("::error::Checkov — Critical/High findings BLOCK this pipeline:")
              for c in blocking:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  sev = c.get("severity", "HIGH")
                  print(f"  [{sev}] {check_id} {resource} — {name}")
              sys.exit(1)

          print(f"Checkov passed. Critical/High: 0 | Medium/Low: {len(warnings)}")
          EOF

      # -----------------------------------------------------------------
      # Step 4: terraform plan
      # Requirement 12.1: Run terraform plan on PRs
      # -----------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/dev.tfvars \
            -input=false \
            -no-color \
            -out=tfplan.binary \
            2>&1 | tee plan_output.txt

      - name: Save Plan Output
        id: plan_output
        run: |
          # Read plan output and truncate to 65,536 characters
          # Requirement 12.2: Truncate to 65,536 chars if exceeded
          PLAN_OUTPUT=$(cat plan_output.txt)
          CHAR_COUNT=${#PLAN_OUTPUT}

          if [ "$CHAR_COUNT" -gt 65536 ]; then
            PLAN_OUTPUT="${PLAN_OUTPUT:0:65500}

          ... (truncated — output exceeded 65,536 characters. Full output: $CHAR_COUNT chars)"
          fi

          # Write to file for the comment step
          echo "$PLAN_OUTPUT" > plan_comment.txt

      # -----------------------------------------------------------------
      # Checkov on Plan (JSON)
      # Requirement 20.5: Run Checkov on saved plan output
      # -----------------------------------------------------------------
      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Checkov Scan (Plan)
        id: checkov_plan
        run: |
          checkov -f tfplan.json \
            --framework terraform_plan \
            --output cli \
            --output json \
            --output-file-path ./plan_checkov \
            --soft-fail \
            || true

      - name: Evaluate Checkov Plan Results
        run: |
          python3 - <<'EOF'
          import json, sys, os

          report_path = "plan_checkov/results_json.json"
          if not os.path.exists(report_path):
              print("::warning::Checkov plan report not found — skipping.")
              sys.exit(0)

          with open(report_path) as f:
              try:
                  report = json.load(f)
              except json.JSONDecodeError:
                  print("::warning::Checkov plan report invalid JSON — skipping.")
                  sys.exit(0)

          checks = []
          if isinstance(report, list):
              for entry in report:
                  checks.extend(entry.get("results", {}).get("failed_checks", []))
          else:
              checks = report.get("results", {}).get("failed_checks", [])

          blocking = []
          warnings = []

          for check in checks:
              severity = check.get("severity", check.get("check_result", {}).get("severity", "UNKNOWN"))
              if severity is None:
                  severity = "UNKNOWN"
              severity = severity.upper()

              if severity in ("CRITICAL", "HIGH"):
                  blocking.append(check)
              elif severity in ("MEDIUM", "LOW"):
                  warnings.append(check)
              else:
                  warnings.append(check)

          if warnings:
              print("::warning::Checkov Plan — Medium/Low findings (non-blocking):")
              for c in warnings[:20]:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  print(f"  [{check_id}] {resource} — {name}")

          if blocking:
              print("::error::Checkov Plan — Critical/High findings BLOCK this pipeline:")
              for c in blocking:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  sev = c.get("severity", "HIGH")
                  print(f"  [{sev}] {check_id} {resource} — {name}")
              sys.exit(1)

          print(f"Checkov Plan passed. Critical/High: 0 | Medium/Low: {len(warnings)}")
          EOF

      # -----------------------------------------------------------------
      # Post Plan as PR Comment
      # Requirement 12.2: Post plan output as PR comment
      # -----------------------------------------------------------------
      - name: Post Plan Comment on PR
        if: always() && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/plan_comment.txt', 'utf8');

            const body = `### Terraform Plan Output\n\n<details>\n<summary>Click to expand plan</summary>\n\n\`\`\`\n${planOutput}\n\`\`\`\n\n</details>\n\n*Workflow: ${context.workflow} | Run: ${context.runId}*`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Terraform Plan Output')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      # -----------------------------------------------------------------
      # Upload Checkov reports as artifacts
      # Requirement 20.8: Retain scan reports for 14 days
      # -----------------------------------------------------------------
      - name: Upload Checkov HCL Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-hcl-report
          path: infra/results_json.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Checkov Plan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-plan-report
          path: infra/plan_checkov/results_json.json
          retention-days: 14
          if-no-files-found: ignore
