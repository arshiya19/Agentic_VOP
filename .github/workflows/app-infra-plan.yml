# =============================================================================
# Agentic_VOP — App Hosting Infrastructure Plan (PR Validation)
# =============================================================================
# Runs on pull requests that modify files under infra/app-hosting/.
#
# Steps:
#   1. terraform fmt -check   — Enforce canonical formatting
#   2. terraform validate     — Syntax and provider validation
#   3. terraform plan         — Preview changes
#   4. Checkov (HCL)          — IaC static analysis on HCL files
#   5. Checkov (Plan)         — IaC static analysis on plan JSON
#   6. Post plan as PR comment
#
# Authentication: GitHub OIDC → AWS role sisyfix-github-infra-plan
# Requirements: 10.5, 10.8, 11.1–11.8
# =============================================================================

name: App Infrastructure Plan

on:
  pull_request:
    branches: ["**"]
    paths:
      - "infra/app-hosting/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: app-infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: "App Infra - Terraform Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/app-hosting

    steps:
      # -----------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # AWS Authentication via GitHub OIDC
      # Requirement 10.8: Use sisyfix-github-infra-plan role for PRs
      # -----------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sisyfix-github-infra-plan
          role-session-name: github-actions-app-infra-plan
          aws-region: us-east-1

      # -----------------------------------------------------------------
      # Terraform Setup
      # -----------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # -----------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------
      - name: Terraform Init
        run: terraform init -backend-config=backend/prod.hcl -input=false

      # -----------------------------------------------------------------
      # Step 1: terraform fmt -check
      # Requirement 11.1: Fail if any file is not canonically formatted
      # -----------------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # -----------------------------------------------------------------
      # Step 2: terraform validate
      # Requirement 11.2: Fail if validation errors are found
      # -----------------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -----------------------------------------------------------------
      # Step 3: terraform plan
      # -----------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/prod.tfvars \
            -input=false \
            -no-color \
            -out=tfplan \
            2>&1 | tee plan_output.txt

      # -----------------------------------------------------------------
      # Convert plan to JSON for Checkov plan scan
      # -----------------------------------------------------------------
      - name: Convert Plan to JSON
        run: terraform show -json tfplan > tfplan.json

      # -----------------------------------------------------------------
      # Step 4: Checkov (HCL) — IaC static analysis on HCL files
      # Requirement 11.3: Run Checkov against HCL files (terraform framework)
      # -----------------------------------------------------------------
      - name: Install Checkov
        run: pip install checkov

      - name: Checkov Scan (HCL)
        id: checkov_hcl
        run: |
          checkov -d . \
            --framework terraform \
            -o cli \
            -o json \
            --output-file-path . \
            --soft-fail-on LOW,MEDIUM \
            || true

      - name: Evaluate Checkov HCL Results
        id: checkov_hcl_eval
        run: |
          python3 - <<'EOF'
          import json, sys, os

          report_path = "results_json.json"
          if not os.path.exists(report_path):
              print("::warning::Checkov HCL report not found — skipping gate evaluation.")
              sys.exit(0)

          with open(report_path) as f:
              try:
                  report = json.load(f)
              except json.JSONDecodeError:
                  print("::warning::Checkov HCL report invalid JSON — skipping gate evaluation.")
                  sys.exit(0)

          # Checkov JSON can be a list of check types or a single object
          checks = []
          if isinstance(report, list):
              for entry in report:
                  checks.extend(entry.get("results", {}).get("failed_checks", []))
          else:
              checks = report.get("results", {}).get("failed_checks", [])

          blocking = []
          warnings = []

          for check in checks:
              severity = check.get("severity", check.get("check_result", {}).get("severity", "UNKNOWN"))
              if severity is None:
                  severity = "UNKNOWN"
              severity = severity.upper()

              if severity in ("CRITICAL", "HIGH"):
                  blocking.append(check)
              elif severity in ("MEDIUM", "LOW"):
                  warnings.append(check)
              else:
                  # Checks without explicit severity — treat as warnings
                  warnings.append(check)

          # Requirement 11.6: Emit MEDIUM/LOW as GitHub Actions warnings (non-blocking)
          if warnings:
              for c in warnings[:50]:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  print(f"::warning::Checkov HCL [{check_id}] {resource} — {name}")

          # Requirement 11.5: Fail on CRITICAL/HIGH findings
          if blocking:
              print("::error::Checkov HCL — Critical/High findings BLOCK this pipeline:")
              for c in blocking:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  sev = c.get("severity", "HIGH")
                  print(f"::error::[{sev}] {check_id} {resource} — {name}")
              sys.exit(1)

          print(f"Checkov HCL passed. Critical/High: 0 | Medium/Low: {len(warnings)}")
          EOF

      # -----------------------------------------------------------------
      # Step 5: Checkov (Plan) — IaC static analysis on plan JSON
      # Requirement 11.4: Run Checkov against plan JSON (terraform_plan framework)
      # -----------------------------------------------------------------
      - name: Checkov Scan (Plan)
        id: checkov_plan
        run: |
          checkov -f tfplan.json \
            --framework terraform_plan \
            -o cli \
            -o json \
            --output-file-path ./plan_checkov \
            --soft-fail-on LOW,MEDIUM \
            || true

      - name: Evaluate Checkov Plan Results
        id: checkov_plan_eval
        run: |
          python3 - <<'EOF'
          import json, sys, os

          report_path = "plan_checkov/results_json.json"
          if not os.path.exists(report_path):
              print("::warning::Checkov plan report not found — skipping.")
              sys.exit(0)

          with open(report_path) as f:
              try:
                  report = json.load(f)
              except json.JSONDecodeError:
                  print("::warning::Checkov plan report invalid JSON — skipping.")
                  sys.exit(0)

          checks = []
          if isinstance(report, list):
              for entry in report:
                  checks.extend(entry.get("results", {}).get("failed_checks", []))
          else:
              checks = report.get("results", {}).get("failed_checks", [])

          blocking = []
          warnings = []

          for check in checks:
              severity = check.get("severity", check.get("check_result", {}).get("severity", "UNKNOWN"))
              if severity is None:
                  severity = "UNKNOWN"
              severity = severity.upper()

              if severity in ("CRITICAL", "HIGH"):
                  blocking.append(check)
              elif severity in ("MEDIUM", "LOW"):
                  warnings.append(check)
              else:
                  warnings.append(check)

          # Requirement 11.6: Emit MEDIUM/LOW as GitHub Actions warnings (non-blocking)
          if warnings:
              for c in warnings[:50]:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  print(f"::warning::Checkov Plan [{check_id}] {resource} — {name}")

          # Requirement 11.5: Fail on CRITICAL/HIGH findings
          if blocking:
              print("::error::Checkov Plan — Critical/High findings BLOCK this pipeline:")
              for c in blocking:
                  check_id = c.get("check_id", "?")
                  name = c.get("check_name", c.get("name", "?"))
                  resource = c.get("resource", "?")
                  sev = c.get("severity", "HIGH")
                  print(f"::error::[{sev}] {check_id} {resource} — {name}")
              sys.exit(1)

          print(f"Checkov Plan passed. Critical/High: 0 | Medium/Low: {len(warnings)}")
          EOF

      # -----------------------------------------------------------------
      # Step 6: Post Plan as PR Comment
      # Requirement 11.8: Post terraform plan output as PR comment
      # Truncate to 65,536 characters if needed
      # -----------------------------------------------------------------
      - name: Prepare Plan Comment
        if: always() && steps.plan.outcome == 'success'
        run: |
          PLAN_OUTPUT=$(cat plan_output.txt)
          CHAR_COUNT=${#PLAN_OUTPUT}

          if [ "$CHAR_COUNT" -gt 65536 ]; then
            PLAN_OUTPUT="${PLAN_OUTPUT:0:65500}

          ... (truncated — output exceeded 65,536 characters. Full output: $CHAR_COUNT chars)"
          fi

          echo "$PLAN_OUTPUT" > plan_comment.txt

      - name: Post Plan Comment on PR
        if: always() && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/app-hosting/plan_comment.txt', 'utf8');

            const body = `### App Hosting — Terraform Plan Output\n\n<details>\n<summary>Click to expand plan</summary>\n\n\`\`\`\n${planOutput}\n\`\`\`\n\n</details>\n\n*Workflow: ${context.workflow} | Run: ${context.runId}*`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### App Hosting — Terraform Plan Output')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      # -----------------------------------------------------------------
      # Upload Checkov reports as artifacts
      # Requirement 11.7: Retain scan reports for 14 days
      # -----------------------------------------------------------------
      - name: Upload Checkov HCL Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-infra-checkov-hcl-report
          path: infra/app-hosting/results_json.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Checkov Plan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-infra-checkov-plan-report
          path: infra/app-hosting/plan_checkov/results_json.json
          retention-days: 14
          if-no-files-found: ignore
